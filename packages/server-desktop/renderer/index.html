<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AiRemote Server — Starting...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }
    .splash {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .logo {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #58a6ff 0%, #3b82f6 100%);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 4px 24px rgba(88, 166, 255, 0.3);
    }
    .title {
      font-size: 22px;
      font-weight: 600;
      color: #e6edf3;
      letter-spacing: -0.3px;
    }
    .subtitle {
      font-size: 13px;
      color: #8b949e;
      margin-top: -8px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #21262d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg) } }
    .status {
      font-size: 12px;
      color: #8b949e;
      min-height: 18px;
    }
    .version {
      position: fixed;
      bottom: 18px;
      font-size: 11px;
      color: #484f58;
    }
    .ctrl-panel {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }
    .ctrl-panel.visible { display: flex; }
    .btn {
      -webkit-app-region: no-drag;
      padding: 8px 20px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #21262d;
      color: #c9d1d9;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
      min-width: 140px;
    }
    .btn:hover { background: #30363d; }
    .btn-primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    .btn-primary:hover { background: #388bfd; }
  </style>
</head>
<body>
<div class="splash">
  <div class="logo">AI</div>
  <div>
    <div class="title">AiRemote Server</div>
    <div class="subtitle">v3.2.0 — Windows Desktop</div>
  </div>
  <div class="spinner" id="spinner"></div>
  <div class="status" id="status-text">Starting server...</div>

  <!-- Show if server fails to start -->
  <div class="ctrl-panel" id="ctrl-panel">
    <div id="error-msg" style="font-size:12px;color:#f85149;margin-bottom:4px;"></div>
    <button class="btn btn-primary" onclick="retryStart()">↻ Retry Start</button>
    <button class="btn" onclick="openSettings()">⚙ Settings</button>
  </div>
</div>
<div class="version">AiRemote Server Desktop v3.2.0</div>

<script>
  let checkInterval = null

  // Check if server is ready by polling /api/health
  async function checkServer() {
    try {
      const res = await fetch('/api/health', { signal: AbortSignal.timeout(3000) })
      if (res.ok) {
        clearInterval(checkInterval)
        document.getElementById('status-text').textContent = 'Dashboard loading...'
        document.getElementById('spinner').style.borderTopColor = '#3fb950'
        // Server is ready but page is still on splash (e.g. static dir missing)
        // Redirect to root which will serve the dashboard
        setTimeout(() => { window.location.reload() }, 500)
        return true
      }
    } catch {}
    return false
  }

  let attempts = 0
  function startPolling() {
    document.getElementById('ctrl-panel').classList.remove('visible')
    document.getElementById('spinner').style.display = ''
    document.getElementById('status-text').textContent = 'Starting server...'
    attempts = 0

    checkInterval = setInterval(async () => {
      attempts++
      document.getElementById('status-text').textContent = `Connecting... (${attempts})`
      const ok = await checkServer()
      if (!ok && attempts > 15) {
        clearInterval(checkInterval)
        checkInterval = null
        document.getElementById('spinner').style.display = 'none'
        document.getElementById('status-text').textContent = 'Server is not responding'
        document.getElementById('error-msg').textContent = 'Failed to start server after 30 seconds'
        document.getElementById('ctrl-panel').classList.add('visible')
      }
    }, 2000)
  }

  function retryStart() {
    if (window.airemote) {
      window.airemote.server.start().then(startPolling).catch(() => startPolling())
    } else {
      startPolling()
    }
  }

  function openSettings() {
    // The desktop panel is in the preload context
    alert('Please use the tray icon to access settings.')
  }

  // Start polling immediately
  startPolling()
</script>
</body>
</html>
