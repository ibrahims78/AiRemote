<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    video, canvas { display: none; }
  </style>
</head>
<body>
<video id="v" autoplay muted playsinline></video>
<canvas id="c"></canvas>
<script>
'use strict'
/* global require */
// desktopCapturer is main-process-only in Electron 20+.
// Strategy 1: getDisplayMedia() — works because main process sets setDisplayMediaRequestHandler.
// Strategy 2: getUserMedia() with chromeMediaSource — legacy fallback.
// Sources (for monitor selection) are always fetched from main via IPC.
const { ipcRenderer } = require('electron')

const video  = document.getElementById('v')
const canvas = document.getElementById('c')
const ctx    = canvas.getContext('2d')

let sessionId       = null
let captureTimer    = null
let frameSeq        = 0
let currentFps      = 20
let currentQuality  = 80
let stream          = null
let cachedSources   = []   // [{id, name, index}] from main process
let lastFrameHash   = 0
let privacyMode     = false

// ── Get screen sources from main process (desktopCapturer) ───────────────
async function getSources() {
  try {
    const sources = await ipcRenderer.invoke('get-screen-sources')
    cachedSources = sources || []
  } catch {
    cachedSources = []
  }
  return cachedSources
}

// ── Start / restart capture ───────────────────────────────────────────────
async function startCapture(sid, fps, quality, monitorIdx) {
  sessionId      = sid
  currentFps     = Math.max(1, Math.min(30, fps     || 5))
  currentQuality = Math.max(10, Math.min(95, quality || 65))

  stopCapture()

  let lastErr = null

  // Strategy 1: getDisplayMedia() — preferred in Electron 21+ because
  // setDisplayMediaRequestHandler bypasses the picker and grants directly.
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false })
    await startFromStream(sid)
    return
  } catch (e1) {
    lastErr = e1
  }

  // Strategy 2: getUserMedia() with desktopCapturer source ID (legacy).
  try {
    const sources = await getSources()
    if (!sources.length) throw new Error('No screens available')

    const idx      = Math.max(0, Math.min(monitorIdx || 0, sources.length - 1))
    const sourceId = sources[idx].id

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        mandatory: {
          chromeMediaSource:   'desktop',
          chromeMediaSourceId: sourceId,
          maxWidth:            1920,
          maxHeight:           1080,
          maxFrameRate:        currentFps
        }
      }
    })
    await startFromStream(sid)
    return
  } catch (e2) {
    lastErr = e2
  }

  // Both strategies failed
  const msg = (lastErr && (lastErr.message || String(lastErr))) || 'getUserMedia failed'
  ipcRenderer.send('screen-error', { sessionId: sid, message: msg })
}

// ── Called once a stream is acquired ────────────────────────────────────
async function startFromStream(sid) {
  video.srcObject = stream
  await new Promise((resolve, reject) => {
    video.onloadedmetadata = resolve
    setTimeout(() => reject(new Error('Video metadata timeout')), 8000)
  })
  frameSeq     = 0
  captureTimer = setInterval(captureFrame, Math.round(1000 / currentFps))

  // Report monitor list
  const sources = cachedSources.length ? cachedSources : await getSources()
  ipcRenderer.send('screen-monitors', {
    sessionId: sid,
    monitors:  sources.length
      ? sources.map((s, i) => ({ id: i, name: s.name, primary: i === 0 }))
      : [{ id: 0, name: 'Screen 1', primary: true }]
  })
}

// ── Fast frame fingerprint (samples ~250 pixels for change detection) ────
function computeFrameHash() {
  const w = canvas.width
  const h = canvas.height
  const d = ctx.getImageData(0, 0, w, h).data
  const step = Math.max(4, Math.floor(d.length / 1000)) & ~3
  let hash = 0
  for (let i = 0; i < d.length; i += step) {
    hash = (Math.imul(hash, 31) + (d[i] | (d[i + 1] << 8) | (d[i + 2] << 16))) | 0
  }
  return hash
}

// ── Capture one frame ────────────────────────────────────────────────────
function captureFrame() {
  if (privacyMode) return
  if (!video.videoWidth || !video.videoHeight || video.readyState < 2) return
  canvas.width  = video.videoWidth
  canvas.height = video.videoHeight
  ctx.drawImage(video, 0, 0)
  const hash = computeFrameHash()
  if (hash === lastFrameHash && frameSeq > 0) return
  lastFrameHash = hash
  const dataUrl = canvas.toDataURL('image/jpeg', currentQuality / 100)
  const base64  = dataUrl.split(',')[1]
  ipcRenderer.send('screen-frame', {
    sessionId: sessionId,
    data:      base64,
    width:     canvas.width,
    height:    canvas.height,
    seq:       frameSeq++
  })
}

// ── Stop capture ─────────────────────────────────────────────────────────
function stopCapture() {
  if (captureTimer) { clearInterval(captureTimer); captureTimer = null }
  if (stream)       { stream.getTracks().forEach(t => t.stop()); stream = null }
  video.srcObject = null
  frameSeq      = 0
  lastFrameHash = 0
}

// ── IPC from main process ─────────────────────────────────────────────────
ipcRenderer.on('start-capture', (_, p) => {
  startCapture(p.sessionId, p.fps, p.quality, p.monitorIndex || 0)
})

ipcRenderer.on('stop-capture', (_, p) => {
  if (!p.sessionId || p.sessionId === sessionId) {
    stopCapture()
    sessionId = null
  }
})

ipcRenderer.on('set-quality', (_, p) => {
  if (p.fps)     currentFps     = Math.max(1, Math.min(30, p.fps))
  if (p.quality) currentQuality = Math.max(10, Math.min(95, p.quality))
  if (captureTimer) {
    clearInterval(captureTimer)
    captureTimer = setInterval(captureFrame, Math.round(1000 / currentFps))
  }
})

ipcRenderer.on('get-monitors', (_, p) => {
  getSources().then(sources => {
    ipcRenderer.send('screen-monitors', {
      sessionId: p.sessionId,
      monitors:  sources.map((s, i) => ({ id: i, name: s.name, primary: i === 0 }))
    })
  }).catch(() => {
    ipcRenderer.send('screen-monitors', {
      sessionId: p.sessionId,
      monitors:  [{ id: 0, name: 'Screen 1', primary: true }]
    })
  })
})

ipcRenderer.on('set-monitor', (_, p) => {
  startCapture(p.sessionId || sessionId, p.fps || currentFps, p.quality || currentQuality, p.monitorId || 0)
})

ipcRenderer.on('set-privacy', (_, p) => {
  privacyMode = !!p.enabled
  if (privacyMode) lastFrameHash = 0
})
</script>
</body>
</html>
